<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AcroVault</title>
    <link href="./src/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header>
        <img
          id="taskbar-icon"
          src="./icons/AcroVault.svg"
          alt="AcroVault"
        />
        <img
          id="settings-icon"
          src="./icons/settings.svg"
          alt="Settings"
          role="button"
          tabindex="0"
          aria-controls="options-sheet"
          aria-expanded="false"
        />
      </header>
      <form id="search-form">
        <input placeholder="Search acronyms..." id="search" name="Acronym-search" autocomplete="off" />
      </form>
      <button id="add-toggle" type="button">+ Add acronym</button>
      <form id="add-form" hidden>
        <input name="acronym" placeholder="Acronym (e.g. IRS)" required />
        <input name="expansion" placeholder="Expansion" required />
        <input name="description" placeholder="Description (optional)" />
        <input name="collection" placeholder="Collection (optional)" />
        <input name="tags" placeholder="Tags, comma separated (optional)" />
        <button type="submit">Save</button>
        <small id="add-error"></small>
      </form>
      <div class="search-container">
        <div id="results"></div>
      </div>
    </div>
    <div id="options-backdrop"></div>
    <section id="options-sheet" aria-label="Options" aria-hidden="true">
      <div class="sheet-header">
        <strong>Options</strong>
        <button id="options-close" type="button" title="Close">×</button>
      </div>
      <p class="sheet-hint">
        Import a .txt file with one acronym per line:<br />
        <code>ACRONYM | Expansion | Description | Collection | tag1, tag2</code><br />
        Everything after Expansion is optional.
      </p>
      <button id="import-button" type="button">Import from .txt</button>
      <input id="import-file" type="file" accept=".txt,text/plain" hidden />
      <button id="export-button" type="button">Export to .txt</button>
      <small id="import-status"></small>
    </section>
    <script src="./src/search/fuse.min.js"></script>
    <script type="module" src="./src/start.js"></script>
  </body>
</html>
